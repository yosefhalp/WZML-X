services:
  wzmlx:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WZMLX_IMAGE:-wzmlx-hebrew:server}
    container_name: ${WZMLX_CONTAINER_NAME:-wzmlx-hebrew-bot}
    command: bash start.sh
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${WZMLX_ENV_PATH:-.env.server}
    environment:
      PORT: ${WZMLX_HOST_PORT:-8080}
      LOCAL_BOT_API_BASE: ${WZMLX_BOT_API_BASE_URL:-http://127.0.0.1:8081}
    labels:
      io.wzmlx.deployment: ${DEPLOYMENT_NAME:-wzmlx-primary}
    volumes:
      - ${WZMLX_CONFIG_PATH:-./config.py}:/usr/src/app/config.py:ro
      - ${WZMLX_ACCOUNTS_DIR:-./accounts}:/usr/src/app/accounts
      - ${WZMLX_DOWNLOADS_DIR:-./downloads}:/usr/src/app/downloads
      - ${WZMLX_CONTROL_DIR:-./runtime/control}:/usr/src/app/runtime/control
    mem_limit: ${WZMLX_MEMORY_LIMIT:-3g}
    cpus: ${WZMLX_CPU_LIMIT:-1.5}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${WZMLX_HOST_PORT:-8080}/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
