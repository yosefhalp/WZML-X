services:
  wzmlx:
    image: python:3.12-alpine
    container_name: ${WZMLX_CONTAINER_NAME}
    command: python /app/e2e_app.py
    restart: unless-stopped
    labels:
      io.wzmlx.deployment: ${DEPLOYMENT_NAME}
      io.wzmlx.test-resource: "true"
    environment:
      E2E_PORT: "8080"
    ports:
      - "127.0.0.1:${WZMLX_HOST_PORT}:8080"
    volumes:
      - ${DEPLOYMENT_CURRENT_LINK}:/release:ro
      - ${DEPLOYMENT_CURRENT_LINK}/deploy/server/e2e/e2e_app.py:/app/e2e_app.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
