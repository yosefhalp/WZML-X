services:
  wzmlx-mongodb:
    image: mongo:8.0.28-noble
    container_name: ${WZMLX_MONGO_CONTAINER_NAME:-wzmlx-mongodb}
    restart: unless-stopped
    env_file:
      - ${WZMLX_MONGO_ENV_PATH:-.env.mongo}
    labels:
      io.wzmlx.deployment: ${DEPLOYMENT_NAME:-wzmlx-primary}
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - wzmlx_mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-wzmlx-user.js:ro
    ports:
      # גישה מהמארח בלבד; להתחברות מהמחשב משתמשים במנהרת SSH.
      - "127.0.0.1:${WZMLX_MONGO_PORT:-27017}:27017"
    networks:
      - wzmlx-internal
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

networks:
  wzmlx-internal:
    name: ${WZMLX_NETWORK_NAME:-wzmlx-internal}

volumes:
  wzmlx_mongo_data:
    name: ${WZMLX_MONGO_VOLUME_NAME:-wzmlx-mongo-data}
